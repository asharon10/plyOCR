name: OCR job
# Runs plyOCR's full-game OCR on one job folder in an S3-compatible bucket
# (e.g. Cloudflare R2), split across several runners in parallel:
#   s3://$OCR_BUCKET/ocr-jobs/<job_id>/
#     game.json, roi.json, markers.json, app/data.json   inputs (only game.json required)
#     defaults/roi.json, defaults/roi_templates.json     optional fallback boxes
#     params.json  {"fps": 0.5, "workers": 4, "decoder": "keyframe", "shards": 6}
# Each shard runner reads every n-th chunk of the video (--shard i/n) and writes
# shards/shard-<i>.json (+ progress-<i>.json while running); the merge runner
# assembles them (--merge-shards) and writes derived/*, status.json and log.txt —
# the same output one machine would write. Logic: .github/scripts/ocr_job.py.
#
# This repo is public, so the run shows nothing about the game: the only input
# is an opaque job id, OCR output goes to log files in the bucket (not the
# console), and no artifacts are kept.
#
# Repo secrets: OCR_S3_ENDPOINT, OCR_BUCKET, OCR_S3_ACCESS_KEY_ID, OCR_S3_SECRET_ACCESS_KEY.

# The title carries the (random, opaque) job id so the caller can find its run.
run-name: OCR job ${{ github.event.inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job folder id (32 hex characters)
        required: true

permissions:
  contents: read

concurrency:
  group: ocr-${{ github.event.inputs.job_id }}

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.OCR_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCR_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  ENDPOINT: ${{ secrets.OCR_S3_ENDPOINT }}
  BUCKET: ${{ secrets.OCR_BUCKET }}
  JOB_ID: ${{ github.event.inputs.job_id }}
  # Same ffmpeg as the reference machine (8.1), pinned: a different ffmpeg can
  # decode a stream's frames at slightly different times, shifting the clock reads.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-18-13-01/ffmpeg-n8.1.3-18-g46d899d7a0-linux64-gpl-8.1.tar.xz

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 .github/scripts/ocr_job.py plan

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null
          curl -sSL "$FFMPEG_URL" | tar -xJ -C /tmp && sudo cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
          pip install -q .
      - name: OCR shard
        run: python3 .github/scripts/ocr_job.py shard

  merge:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHARD_RESULT: ${{ needs.shard.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        if: needs.shard.result == 'success'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null
          curl -sSL "$FFMPEG_URL" | tar -xJ -C /tmp && sudo cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/
          pip install -q .
      - name: Merge
        run: python3 .github/scripts/ocr_job.py merge
