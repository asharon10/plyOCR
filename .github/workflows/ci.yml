name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System tools (tesseract, ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  release:
    # Tag vX.Y.Z → build the wheel and attach it to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
